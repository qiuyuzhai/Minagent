[project]
name = "minagent"
version = "0.1.0"
description = "参考开源 agent（pi、Claude Code 等）的设计，用 Python 复现 agent runtime 核心机制"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50.0",
    "pydantic>=2.0.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
memory = [
    "qdrant-client>=1.12.0",
    "rank-bm25>=0.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
